# CI de ShelfVision AI: corre la suite de pytest y construye la imagen Docker
# en cada PR hacia main y en cada push a main. Los nombres de los jobs
# ("tests" y "docker") son los checks que exige la proteccion de main.
# Las acciones van fijadas por commit (#54): una etiqueta como "v7" la puede mover
# su autor y cambiar lo que corre la CI. Para subir de version, cambiar el commit
# y el comentario con la version (gh api repos/<accion>/commits/<etiqueta>).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Un push nuevo a un PR cancela la corrida anterior del mismo PR. En main no se
# cancela: cada merge conserva su resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Runner fijo en ubuntu-24.04: ubuntu-latest pasa a Ubuntu 26 desde el
# 2026-10-19; se cambia a proposito, no por sorpresa.
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Misma version de Python que la imagen Docker (python:3.13-slim-trixie).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      # PyTorch solo CPU antes que el resto: desde PyPI, en Linux se descargan
      # varios GB de CUDA/cuDNN que el runner no usa (igual que en el Dockerfile).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Ningun test necesita datasets ni pesos: test_models.py construye YOLO26
      # desde su YAML, sin conexion.
      - name: Run tests
        run: pytest tests/ -q

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Solo se construye, no se publica. load: true deja la imagen en el
      # daemon local para poder correr los tests dentro de ella.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: shelfvision-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # tests/ no se copia a la imagen (.dockerignore), asi que se monta. La
      # imagen corre sin DEBUG, y la app web exige entonces una SECRET_KEY.
      - name: Run tests inside image
        run: docker run --rm -e DJANGO_SECRET_KEY=ci -v "$PWD/tests:/app/tests" shelfvision-ai:ci python -m pytest tests/ -q
